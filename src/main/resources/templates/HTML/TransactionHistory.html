<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử giao dịch | GameStore</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons + FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #0a1525;
            color: #e2e8f0;
            font-family: "Segoe UI", sans-serif;
        }

        .card {
            background: #0f1c2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }

        h4 {
            color: #ffcc00;
            font-weight: 600;
        }

        .nav-pills .nav-link {
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.05);
            margin-right: 5px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link.active {
            background: linear-gradient(45deg, #ffcc00, #ffa600);
            color: #0f1c2e;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
        }

        .table {
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }

        .table thead {
            background: rgba(255, 255, 255, 0.08);
        }

        .table-hover tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .fw-bold { font-weight: 600 !important; }

        .badge {
            padding: 6px 10px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .tab-pane { animation: fadeIn .4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="card p-4 shadow-sm">
        <h4 class="mb-3"><i class="bi bi-clock-history me-2"></i>Lịch sử giao dịch</h4>

        <!-- Tabs -->
        <ul class="nav nav-pills mb-3" id="transactionTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="nap-tab" data-bs-toggle="pill" data-bs-target="#nap" type="button">
                    <i class="bi bi-cash-stack me-1"></i> Nạp tiền
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="game-tab" data-bs-toggle="pill" data-bs-target="#game" type="button">
                    <i class="bi bi-controller me-1"></i> Mua game
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="other-tab" data-bs-toggle="pill" data-bs-target="#other" type="button">
                    <i class="bi bi-receipt-cutoff me-1"></i> Thanh toán khác
                </button>
            </li>
        </ul>

        <!-- Nội dung tab -->
        <div class="tab-content">

            <!-- Lịch sử nạp -->
            <div class="tab-pane fade show active" id="nap" role="tabpanel">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Ngày</th>
                        <th>Số tiền</th>
                        <th>Phương thức</th>
                        <th>Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, iStat : ${topups}">
                        <td th:text="${iStat.index + 1}"></td>
                        <td th:text="${#dates.format(item.date, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="text-success fw-bold"
                            th:text="'+' + ${#numbers.formatDecimal(item.amount, 0, 'POINT', 0, 'COMMA')} + '₫'"></td>
                        <td th:text="${item.method}"></td>
                        <td>
                            <span th:classappend="${item.status == 'Thành công'} ? 'badge bg-success' :
                                                 (item.status == 'Đang xử lý' ? 'badge bg-warning text-dark' :
                                                 'badge bg-secondary')"
                                  th:text="${item.status}"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(topups)}">
                        <td colspan="5" class="text-center text-light">Chưa có giao dịch nạp nào</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Lịch sử mua game -->
            <div class="tab-pane fade" id="game" role="tabpanel">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Tên game</th>
                        <th>Ngày mua</th>
                        <th>Giá</th>
                        <th>Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, iStat : ${purchases}">
                        <td th:text="${iStat.index + 1}"></td>
                        <td th:text="${item.game.gameName}"></td>
                        <td th:text="${#temporals.format(item.purchaseDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="text-danger fw-bold"
                            th:text="'-' + ${#numbers.formatDecimal(item.game.price, 0, 'POINT', 0, 'COMMA')} + '₫'"></td>
                        <td>
                            <span th:classappend="${item.status == 1} ? 'badge bg-success' :
                                                 (${item.status == 0} ? 'badge bg-warning text-dark' : 'badge bg-secondary')"
                                  th:text="${item.status == 1 ? 'Hoàn tất' : (item.status == 0 ? 'Đang xử lý' : 'Hủy')}"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(purchases)}">
                        <td colspan="5" class="text-center text-light">Chưa có giao dịch mua game nào</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Lịch sử thanh toán khác -->
            <div class="tab-pane fade" id="other" role="tabpanel">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Ngày</th>
                        <th>Nội dung</th>
                        <th>Số tiền</th>
                        <th>Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, iStat : ${refunds}">
                        <td th:text="${iStat.index + 1}"></td>
                        <td th:text="${#dates.format(item.date, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${item.description}"></td>
                        <td th:text="${item.amount > 0 ? '+' + #numbers.formatDecimal(item.amount, 0, 'POINT', 0, 'COMMA') + '₫' :
                                           #numbers.formatDecimal(item.amount, 0, 'POINT', 0, 'COMMA') + '₫'}"
                            th:classappend="${item.amount > 0 ? 'text-success fw-bold' : 'text-danger fw-bold'}"></td>
                        <td>
                            <span th:classappend="${item.status == 'Đã hoàn'} ? 'badge bg-info text-dark' : 'badge bg-secondary'"
                                  th:text="${item.status}"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(refunds)}">
                        <td colspan="5" class="text-center text-light">Không có thanh toán nào khác</td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
