<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #07111e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: "Inter", sans-serif;
        }

        .card-box {
            width: 420px;
            background: rgba(255, 255, 255, 0.06);
            padding: 30px;
            border-radius: 18px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .form-control {
            background: #152337;
            border: none;
            color: #fff;
        }

        .form-control:focus {
            background: #1b324d;
            border: 1px solid #4da3ff;
            color: #fff;
        }

        .btn-primary {
            background: #4da3ff;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #63b1ff;
        }

        .link-back {
            color: #9bb4d1;
            text-decoration: none;
        }

        .link-back:hover {
            color: #cbe1ff;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card-box">

    <h3 class="text-center mb-3">Quên mật khẩu</h3>
    <p class="text-center text-secondary">
        Nhập email để nhận mã xác thực đặt lại mật khẩu.
    </p>

    <!-- FORM -->
    <form id="sendOtpForm" novalidate>
        <label class="form-label mt-2">Email</label>
        <input type="email" class="form-control" id="emailInput" required placeholder="your@email.com">
        <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>

        <button class="btn btn-primary w-100 mt-3" type="submit">
            Gửi mã xác thực
        </button>

        <div id="msgBox" class="form-text mt-3"></div>

        <div class="text-center mt-3">
            <a href="/login" class="link-back">← Quay lại đăng nhập</a>
        </div>
    </form>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const form = document.getElementById("sendOtpForm");
    const emailInput = document.getElementById("emailInput");
    const msgBox = document.getElementById("msgBox");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!emailInput.checkValidity()) {
            emailInput.classList.add("is-invalid");
            return;
        } else {
            emailInput.classList.remove("is-invalid");
        }

        const email = emailInput.value.trim();

        // TODO: CALL API GỬI OTP
        // Thay URL đúng backend của bạn
        try {
            const res = await fetch("/auth/send-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });

            if (res.ok) {
                msgBox.style.color = "#6aff8a";
                msgBox.textContent = "✅ Mã xác thực đã gửi đến email của bạn!";
            } else {
                msgBox.style.color = "#ff6b6b";
                msgBox.textContent = "❌ Không thể gửi mã. Vui lòng thử lại.";
            }
        } catch {
            msgBox.style.color = "#ff6b6b";
            msgBox.textContent = "❌ Lỗi mạng, vui lòng thử lại.";
        }
    });
</script>

</body>

</html>
