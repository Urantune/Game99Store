<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Confirm Email — Đổi mật khẩu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- CSRF (nếu bạn bật Spring Security CSRF) -->
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        body{background:#0b1220;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .card-box{width:460px;background:rgba(255,255,255,.06);padding:28px;border-radius:18px;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12)}
        .form-control{background:#152337;border:none;color:#fff}
        .form-control:focus{background:#1b324d;border:1px solid #4da3ff;color:#fff;box-shadow:none}
        .btn-primary{background:#4da3ff;border:none;font-weight:600}
        .btn-primary:hover{background:#63b1ff}
        .muted{color:#9bb4d1}
    </style>
</head>
<body>

<div class="card-box">
    <h3 class="mb-2 text-center">Xác nhận email để đổi mật khẩu</h3>
    <p class="text-center muted mb-4">Vui lòng nhập lại email trùng với email tài khoản để tiếp tục.</p>

    <!-- Thông tin lấy từ server -->
    <div class="mb-3">
        <div class="d-flex justify-content-between">
            <span class="muted">Tài khoản</span>
            <strong th:text="${user.username}">username</strong>
        </div>

    </div>

    <!-- Giữ userId & email server trong data-attr để dùng JS -->
    <div id="serverData"
         th:data-user-id="${user.id}"
         th:data-user-email="${user.email}"></div>

    <form id="confirmEmailForm" novalidate>
        <label class="form-label">Nhập email của bạn</label>
        <input type="email" id="emailInput" class="form-control" placeholder="nhập lại email của bạn" required>
        <div class="invalid-feedback">Email không hợp lệ.</div>

        <button class="btn btn-primary w-100 mt-3" type="submit" id="submitBtn">
            Xác nhận & tiếp tục
        </button>

        <div id="msgBox" class="form-text mt-3"></div>

        <div class="text-center mt-3">
            <a th:href="@{/welcome/profile/{id}(id=${user.id})}" class="text-decoration-none muted">← Quay lại hồ sơ</a>
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('confirmEmailForm');
    const emailInput = document.getElementById('emailInput');
    const msgBox = document.getElementById('msgBox');
    const submitBtn = document.getElementById('submitBtn');
    const serverData = document.getElementById('serverData');
    const userId = serverData.dataset.userId;
    const serverEmail = serverData.dataset.userEmail;

    // bạn muốn chỉ cần có @ là hợp lệ:
    function isValidEmailLoose(v){ return /^[^@\s]+@[^@\s]+$/.test(v); }

    function showMsg(t, ok=false){
        msgBox.style.color = ok ? '#6aff8a' : '#ff6b6b';
        msgBox.textContent = t;
    }

    function getCsrf(){
        const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
        return {token, header};
    }

    form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const inputEmail = emailInput.value.trim();

        if(!isValidEmailLoose(inputEmail)){
            emailInput.classList.add('is-invalid');
            showMsg('❌ Email không hợp lệ. Phải có ký tự trước và sau "@".');
            return;
        } else {
            emailInput.classList.remove('is-invalid');
            showMsg('');
        }

        submitBtn.disabled = true;

        // (1) Check nhanh trên client (so sánh với email server đã render)
        if (inputEmail.toLowerCase() !== serverEmail.toLowerCase()){
            showMsg('❌ Email không trùng với email tài khoản.');
            submitBtn.disabled = false;
            return;
        }

        // (2) Gọi API xác thực server (an toàn hơn)
        try{
            const csrf = getCsrf();
            const headers = {"Content-Type":"application/json"};
            if(csrf.token && csrf.header) headers[csrf.header] = csrf.token;

            const res = await fetch('/welcome/verify-reset', {
                method: 'POST',
                headers,
                body: JSON.stringify({ id: userId, email: inputEmail })
            });

            const data = await res.json().catch(()=> ({}));

            if (res.ok){
                showMsg(data.message || '✅ Xác thực thành công!', true);

                setTimeout(()=>{
                    window.location.href = `/welcome/changepass?email=${encodeURIComponent(inputEmail)}`;
                }, 500);
            } else {
                showMsg(data.error || '❌ Email không khớp. Vui lòng thử lại.');
            }
        } catch(err){
            showMsg('❌ Lỗi mạng, vui lòng thử lại.');
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
<script th:src="@{/Accest/JS/code.js}"></script>
</body>
</html>
