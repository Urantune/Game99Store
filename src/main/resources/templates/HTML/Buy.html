<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán - Game Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#123965; font-family: Arial, sans-serif; }
        .checkout { max-width:1050px; margin:40px auto; background:rgba(0,60,100,0.6); padding:22px; border-radius:16px; color:#fff; }
        .title{font-size:28px;font-weight:800;color:#FFD700;text-align:center;margin-bottom:16px;}
        .summary-card{background:rgba(0,0,0,.25);border-radius:14px;padding:16px;}
        .money-badge{font-size:24px;font-weight:800;color:#00E676;}
        .subtle{color:#cfd8dc;}
        .thumb{width:140px;height:84px;border-radius:10px;overflow:hidden;}
        .thumb img{width:100%;height:100%;object-fit:cover;}
        .btn-success{background:linear-gradient(135deg,#28a745,#006400);border:none;border-radius:10px;padding:12px 22px;font-weight:700;}
        .btn-primary{background:linear-gradient(135deg,#007bff,#003a80);border:none;border-radius:10px;padding:10px 18px;}
        .total-row{background:rgba(255,215,0,0.12);font-weight:700;}
        .price-neg{color:#FF7043;font-weight:700;}
        .price-pos{color:#00E676;font-weight:700;}
        .hint{font-size:12px;color:#B0BEC5;}
        .divider{height:1px;background:rgba(255,255,255,.12);margin:14px 0;}
        .badge-ok{background:rgba(0,230,118,.15);border:1px solid rgba(0,230,118,.4);color:#a5f5c9;padding:2px 8px;border-radius:10px;font-size:12px;}
        .badge-expired{background:rgba(255,82,82,.15);border:1px solid rgba(255,82,82,.4);color:#ffc1c1;padding:2px 8px;border-radius:10px;font-size:12px;}
    </style>
</head>
<body>

<div class="checkout">
    <div class="title">Thanh toán</div>

    <div class="row g-3">

        <div class="col-lg-7">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th style="width:160px;">Ảnh</th>
                    <th>Game</th>
                    <th class="text-end">Giá</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${listGame == null or #lists.isEmpty(listGame)}">
                    <td colspan="3" class="text-center">Không có game trong giỏ.</td>
                </tr>

                <tr th:each="item: ${listGame}">
                    <td>
                        <div class="thumb">
                            <img th:src="${'/' + @gameCore.imageLinkGame(item).getMainImage()}" alt="thumb">
                        </div>
                    </td>

                    <td>
                        <div th:text="${item.gameName}"></div>
                        <input type="hidden" name="selectedIds" th:value="${item.gameId}" form="checkoutForm">
                    </td>

                    <td class="text-end" th:with="d=${perGameDiscount != null ? perGameDiscount[item.gameId] : null}">
                        <div>
                            <span th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')}"></span>
                            <span> ₫</span>
                        </div>
                        <div th:if="${d != null and d > 0}" class="price-neg small">
                            − <span th:text="${#numbers.formatDecimal(d,0,'COMMA',0,'POINT')}"></span> ₫
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/welcome}" class="btn btn-primary">← Tiếp tục mua sắm</a>
        </div>

        <div class="col-lg-5">
            <div class="summary-card">

                <div class="d-flex justify-content-between align-items-center">
                    <div class="subtle">Số dư ví của bạn</div>
                    <div class="fw-bold">
                        <span th:text="${#numbers.formatDecimal(user.price,0,'COMMA',0,'POINT')}"></span> ₫
                    </div>
                </div>

                <div class="divider"></div>

                <form id="checkoutForm"
                      th:action="@{/welcome/waitCheckPay}"
                      method="post"
                      class="mt-2">

                    <input type="hidden" name="userId" th:value="${user.id}">
                    <input th:if="${appliedVoucherId != null}" type="hidden" name="voucherId" th:value="${appliedVoucherId}">
                    <input th:if="${_csrf!=null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="mb-2">
                        <label for="voucherInput" class="form-label mb-1">Mã voucher</label>
                        <div class="d-flex gap-2">
                            <input id="voucherInput" type="text" class="form-control" name="voucherCode"
                                   th:value="${appliedVoucherCode}" placeholder="Nhập mã giảm giá">

                            <button type="submit" class="btn btn-primary" th:formaction="@{/welcome/buy/voucher}">
                                Áp dụng
                            </button>
                        </div>
                        <div class="d-flex align-items-center gap-2 mt-1">
                            <span class="hint" th:text="${voucherMessage}"></span>
                            <span th:if="${appliedVoucherCode != null}" class="badge-ok" th:text="${appliedVoucherCode}"></span>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="table-responsive">
                        <table class="table table-sm text-white align-middle mb-2">
                            <tbody>
                            <tr>
                                <td class="subtle">Tạm tính</td>
                                <td class="text-end">
                                    <span th:text="${#numbers.formatDecimal(subtotal,0,'COMMA',0,'POINT')}"></span> ₫
                                </td>
                            </tr>
                            <tr>
                                <td class="subtle">Giảm giá (voucher)</td>
                                <td class="text-end price-neg">
                                    − <span th:text="${#numbers.formatDecimal(discount,0,'COMMA',0,'POINT')}"></span> ₫
                                </td>
                            </tr>
                            <tr class="total-row">
                                <td>Thành tiền</td>
                                <td class="text-end price-pos">
                                    <span th:text="${#numbers.formatDecimal(grandTotal,0,'COMMA',0,'POINT')}"></span> ₫
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="subtle">Thành tiền (ước tính)</div>
                        <div class="money-badge">
                            <span th:text="${#numbers.formatDecimal(grandTotal,0,'COMMA',0,'POINT')}"></span> ₫
                        </div>
                    </div>

                    <div th:if="${thongbao == 'khongdusodu'}" class="alert alert-warning py-2 mb-2">
                        Số dư không đủ. Vui lòng nạp thêm hoặc bỏ bớt sản phẩm.
                    </div>

                    <div class="d-flex gap-2 mt-2">
                        <button type="submit" class="btn btn-success w-100" name="action" value="pay">
                            Payment Request
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

<script th:src="@{/Accest/JS/code.js}"></script>
</body>
</html>
