<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>GameStore - Danh mục</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
    <link th:href="@{/Accest/css/styles1.css}" rel="stylesheet"/>
    <style>
        body{background-color:#0f1c2e;}
        .btn-cart{background:#146c43;color:#fff!important;border:none!important;font-weight:500;transition:.3s;}
        .btn-cart:hover{background:linear-gradient(90deg,#20c997,#28a745);transform:translateY(-2px);box-shadow:0 4px 10px rgba(40,167,69,.4);}
        .btn-login{background:linear-gradient(90deg,#198754,#28a745);color:#fff;border:none;box-shadow:0 0 6px rgba(25,135,84,.4);transition:.3s;}
        .btn-login:hover{background:linear-gradient(90deg,#28a745,#34ce57);box-shadow:0 0 15px rgba(40,167,69,.8);transform:translateY(-2px);}
        .btn-register{background:linear-gradient(90deg,#0d6efd,#2a9df4);color:#fff;border:none;box-shadow:0 0 6px rgba(13,110,253,.4);transition:.3s;}
        .btn-register:hover{background:linear-gradient(90deg,#2a9df4,#0dcaf0);box-shadow:0 0 15px rgba(13,110,253,.8);transform:translateY(-2px);}
        .navbar-nav .nav-link{text-transform:uppercase;font-size:1.05rem;font-weight:700;letter-spacing:.5px;
            transition:color .3s, transform .2s, border-bottom .2s; padding-bottom:4px; border-bottom:2px solid transparent;}
        .navbar-nav .nav-link:hover{color:#0dcaf0; transform:translateY(-2px); border-bottom:2px solid #0dcaf0;}
        .card{transition:transform .3s, box-shadow .3s; background:#112238; border:1px solid #1b3557;}
        .card:hover{transform:scale(1.03); box-shadow:0 8px 20px rgba(0,0,0,.5);}
        .card h5, .card p, .text-white{color:#fff!important}
        .age-box{border:1px solid #000;padding:2px 6px;font-weight:700;border-radius:3px;display:inline-block;}
        footer.custom-footer{background:linear-gradient(135deg,#0b0f29,#1b2347);border-top:2px solid #1e3a8a;}
    </style>
</head>
<body>

<!-- ===== Header / Navbar giữ nguyên nút logo + đăng nhập/đăng ký + cart/avatar ===== -->
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:#0f1c2e;">
    <div class="container-fluid px-4 px-lg-5 d-flex justify-content-between align-items-center">
        <a th:href="@{/welcome/index}" class="logo-link text-white fs-4 text-decoration-none">
            <h3 class="fw-bolder mb-0">🎮 GameStore</h3>
        </a>

        <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/welcome/news}">TIN TỨC</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/welcome/events}">SỰ KIỆN</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/welcome/top}">TOP GAME</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/welcome/sale}">GIẢM GIÁ</a></li>
        </ul>

        <div class="d-flex align-items-center">
            <a th:if="${session.username != null}"
               th:href="@{/welcome/Cart/{id}(id=${session.id})}"
               class="btn btn-cart me-2">
                <i class="bi bi-cart-fill me-1"></i> Cart
            </a>

            <div th:if="${session.username == null}">
                <button class="btn btn-login me-2" data-bs-toggle="modal" data-bs-target="#loginModal">Đăng nhập</button>
                <button class="btn btn-register" data-bs-toggle="modal" data-bs-target="#registerModal">Đăng ký</button>
            </div>

            <div th:if="${session.username != null}" class="d-flex flex-column align-items-center">
                <a th:href="@{/welcome/profile/{id}(id=${session.id})}" class="d-inline-flex justify-content-center">
                    <img th:src="${session.avatar != null ? session.avatar : '/img/demo1.jpg'}"
                         alt="Avatar" class="rounded-circle"
                         style="width:45px;height:45px;object-fit:cover;border:2px solid #666;cursor:pointer;">
                </a>
                <span class="mt-1 text-light" style="font-size:.9rem;font-weight:600" th:text="${session.username}"></span>
            </div>
        </div>
    </div>
</nav>


<section class="py-5" style="background-color:#0f1c2e;">
    <div class="container px-4 px-lg-5 mt-5">
        <h2 class="fw-bolder mb-4 text-white" th:text="${tieude}"></h2>
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">

            <th:block th:each="game : ${listGame}">
                <div class="col mb-5">
                    <a th:href="@{'/welcome/gamedetail/' + ${game.gameId}}"
                       style="text-decoration:none; color:inherit;">
                        <div class="card h-100">

                            <img class="card-img-top"

                                 th:src="${game.getImageLinks()[4]}"
                                 th:alt="${game.gameName}"/>

                            <img class="card-img-top"

                                 th:src="@{'/'+${game.getLinkImage()[4]}}"
                                 th:alt="${game.gameName}"/>

                            <div class="card-body p-4">
                                <div class="text-center">
                                    <h5 class="fw-bolder" th:text="${game.gameName}"></h5>
                                    <div class="d-flex justify-content-center small text-warning mb-2">
                                        <div class="bi-star-fill"></div>
                                    </div>
                                    <p th:text="'$' + ${game.price}"></p>
                                </div>

                                <div class="game-stats d-flex align-items-center mb-3">
                                    <div class="stat-item text-center">
                                        <strong>4,5 ★</strong>
                                        <div class="small text-muted">7,5 Tr đánh giá</div>
                                    </div>
                                    <div class="stat-item text-center">
                                        <strong th:text="${game.deceptions[1]}"></strong>
                                        <div class="small text-muted">Dung lượng</div>
                                    </div>
                                    <div class="stat-item text-center">
                                        <strong th:text="${game.deceptions[2]}"></strong>
                                        <div class="small text-muted">Lượt tải xuống</div>
                                    </div>
                                    <div class="stat-item text-center">
                                        <span class="age-box" th:text="${game.deceptions[4]}"></span>
                                        <div class="small text-muted"
                                             th:text="${game.deceptions[4]} + ' tuổi trở lên'"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent d-flex justify-content-between">

                            </div>
                        </div>
                    </a>
                </div>
            </th:block>

        </div>
    </div>
</section>



<footer class="custom-footer py-4 text-white">
    <div class="container text-center text-white-50 small">
        © 2025 <span class="fw-bold text-primary">GameStore</span>. All rights reserved.
    </div>
</footer>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Login</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <form method="post" th:action="@{/welcome/login}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input class="form-control" name="username" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required/>
                </div>
                <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
            </form>
        </div>
    </div></div>
</div>

<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Register</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <form id="registerForm">
                <div class="mb-3"><label class="form-label">Username</label>
                    <input class="form-control" name="username" required/></div>
                <div class="mb-3"><label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required/></div>
                <div class="mb-3"><label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="password" required/></div>
                <div class="mb-3"><label class="form-label">Confirm password</label>
                    <input type="password" class="form-control" id="confirmPassword" required/>
                    <div id="passwordMessage" class="form-text text-danger"></div></div>
                <button class="btn btn-success w-100" type="submit">Đăng ký</button>
            </form>
        </div>
    </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

    document.addEventListener('DOMContentLoaded', ()=> {
        const f=document.getElementById('registerForm'); if(!f) return;
        const p=document.getElementById('password'), c=document.getElementById('confirmPassword'), m=document.getElementById('passwordMessage');
        const chk=()=>{ m.textContent=(c.value && p.value!==c.value)?'Mật khẩu không khớp!':''; };
        p.addEventListener('input',chk); c.addEventListener('input',chk);
        f.addEventListener('submit',e=>{ if(p.value!==c.value){ e.preventDefault(); m.textContent='Mật khẩu không khớp!'; }});
    });
</script>
</body>
</html>
