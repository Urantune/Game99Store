<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>📩 Liên hệ trực tiếp - GameStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #19002b 0%, #0a0a0a 100%);
            color: #f0f0f0;
            font-family: "Segoe UI", "Roboto", sans-serif;
            min-height: 100vh;
            padding: 80px 0;
        }
        .container {
            max-width: 600px;
            margin-bottom: 50px;
        }
        h2 {
            text-align: center;
            font-weight: 600;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(40,30,60,0.9);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 15px rgba(142, 45, 226, 0.4);
            margin-bottom: 40px;
        }
        label {
            font-weight: 500;
            color: #ddd;
        }
        textarea {
            background: rgba(35,35,55,0.9);
            color: #fff;
            border: 1px solid rgba(150,80,255,0.4);
            border-radius: 8px;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            resize: none;
        }
        textarea:focus {
            border-color: #b96fff;
            box-shadow: 0 0 10px rgba(160,90,255,0.4);
            outline: none;
        }
        .btn-submit {
            background: linear-gradient(90deg, #8E2DE2, #4A00E0);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
            margin-top: 15px;
            width: 100%;
        }
        .btn-submit:hover {
            background: linear-gradient(90deg, #a85ff0, #6b2ae2);
            box-shadow: 0 0 20px rgba(142, 45, 226, 0.6);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📩 Liên hệ trực tiếp</h2>

    <div class="card">
        <form id="supportForm">
            <div class="mb-3">
                <label for="userQuestion">Nội dung yêu cầu / Tin nhắn</label>
                <textarea id="userQuestion" name="user_question" rows="6" placeholder="Nhập nội dung..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Gửi tin nhắn</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
    emailjs.init("PBiaYvMLWpe-woLFT"); // Thay bằng User ID EmailJS của bạn

    document.getElementById("supportForm").addEventListener("submit", function(e){
        e.preventDefault();

        const params = {
            user_question: document.getElementById("userQuestion").value,
            time: new Date().toLocaleString()
        };

        emailjs.send("service_7s3q9n7", "template_b49f7wf", params)
            .then(() => {
                alert("✅ Tin nhắn của bạn đã được gửi! Chúng tôi sẽ phản hồi sớm.");
                document.getElementById("supportForm").reset();
            })
            .catch(err => {
                console.error(err);
                alert("❌ Gửi tin nhắn thất bại. Vui lòng thử lại!");
            });
    });
</script>

</body>
</html>
