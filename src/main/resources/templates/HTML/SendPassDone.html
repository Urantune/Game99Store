<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Email đã được gửi</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body {
            background: #07111e; min-height: 100vh; display:flex; align-items:center; justify-content:center;
            color:#fff; font-family: "Inter", sans-serif; padding: 24px;
        }
        .card-box {
            width:420px; background: rgba(255,255,255,.06); padding:30px; border-radius:18px;
            border:1px solid rgba(255,255,255,.12); box-shadow:0 8px 25px rgba(0,0,0,.35); backdrop-filter: blur(12px);
        }
        .btn-primary { background:#4da3ff; border:none; font-weight:600; }
        .btn-primary:hover { background:#63b1ff; }
        .link-back { color:#9bb4d1; text-decoration:none; }
        .link-back:hover { color:#cbe1ff; text-decoration:underline; }
    </style>
</head>
<body>

<div class="card-box text-center">
    <h3 class="mb-3">Email đã được gửi!</h3>
    <p class="text-secondary">
        Một email xác thực đã được gửi vào tài khoản của bạn.
        Vui lòng kiểm tra hộp thư và làm theo hướng dẫn.
    </p>

    <button class="btn btn-primary w-100 mt-3" id="backHomeBtn">
        Quay về trang chủ
    </button>
</div>

<script>
    document.getElementById("backHomeBtn").addEventListener("click", () => {
        window.location.href = "/welcome";
    });
</script>

</body>
</html>
