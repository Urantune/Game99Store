<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Request Refund - GameStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b0b17;
            color:#eee;
            padding:60px 0;
            font-family: Arial, sans-serif;
        }
        .container{max-width:700px;}
        .box{
            background:#1a1a2e;
            padding:25px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,.1);
            box-shadow:0 0 12px rgba(0,0,0,.5);
        }
        label{font-weight:600;margin-top:10px;}
        .btn-submit{
            margin-top:20px;
            padding:10px 30px;
            background:#6d28d9;
            border:none;
            color:white;
            border-radius:10px;
            font-weight:600;
        }
        .btn-submit:hover{opacity:.8;}
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Refund Request</h2>

    <div class="box">
        <form method="post" th:action="@{/welcome/refundGame}">

            <input type="hidden" name="gameId" th:value="${game.gameId}" />

            <div class="mb-3">
                <label>Game</label>
                <input class="form-control" th:value="${game.gameName}" disabled />
            </div>

            <div class="mb-3">
                <label>Refund Reason</label>
                <select class="form-select" name="reason" required>
                    <option value="">-- Select a reason --</option>
                    <option value="Missing advertised content">Missing advertised content</option>
                    <option value="Unplayable / cannot run the game">Unplayable / cannot run the game</option>
                </select>
            </div>

            <button class="btn-submit" type="submit">Submit refund</button>
        </form>
    </div>
</div>

</body>
</html>
