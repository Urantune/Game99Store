<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Refund Successful - GameStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b0b17;
            color:#eee;
            padding:60px 0;
            font-family: Arial, sans-serif;
        }
        .container{max-width:700px;}
        .box{
            background:#1a1a2e;
            padding:25px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,.1);
            box-shadow:0 0 12px rgba(0,0,0,.5);
            text-align:center;
        }
        .game-name{
            font-size:1.4rem;
            font-weight:700;
            margin-top:10px;
            color:#fbbf24;
        }
        .info-line{margin-top:10px;font-size:0.95rem;}
        .btn-back{
            margin-top:20px;
            padding:10px 30px;
            background:#10b981;
            border:none;
            color:white;
            border-radius:10px;
            font-weight:600;
            text-decoration:none;
            display:inline-block;
        }
        .btn-back:hover{opacity:.85;}
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Refund Successful</h2>

    <div class="box">
        <div>✅ Your refund has been processed.</div>

        <div class="game-name" th:text="${game.gameName}">Game name</div>

        <div class="info-line">
            Refunded amount:
            <span class="text-info" th:text="${refundAmount}">0</span>
        </div>

        <div class="info-line">
            Refund reason:
            <span class="text-warning" th:text="${reason}">reason</span>
        </div>

        <a th:href="@{/welcome}" class="btn-back">
            Back to My Games
        </a>
    </div>
</div>

</body>
</html>
