<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>💰 Ví GamePay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:radial-gradient(circle at top,#19002b 0%,#0a0a0a 100%);color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh}
        .wallet-container{max-width:800px;margin:80px auto;background:rgba(255,255,255,0.08);border-radius:20px;box-shadow:0 0 20px rgba(255,255,255,0.2);padding:40px;backdrop-filter:blur(12px)}
        .wallet-header{text-align:center;margin-bottom:30px}
        .wallet-header h2{font-weight:bold;color:#fff}
        .balance{text-align:center;font-size:2rem;margin-bottom:8px}
        .subtle{text-align:center;color:rgba(255,255,255,.7);margin-bottom:24px}
        .chart-container{margin-top:30px;text-align:center}
        canvas{background:rgba(255,255,255,0.05);border-radius:15px;padding:10px}
        a.back-home{color:#fff;text-decoration:none;display:inline-block;margin-top:25px;font-weight:500}
        a.back-home:hover{text-decoration:underline}
    </style>
</head>
<body>
<div class="wallet-container">
    <div class="wallet-header">
        <h2><i class="bi bi-wallet2"></i> Ví GamePay</h2>
        <p>Quản lý và theo dõi giao dịch của bạn</p>
    </div>

    <div class="balance">
        <strong>Tổng chi tiêu:</strong>
        <span th:text="${#numbers.formatDecimal(balance, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
    </div>

    <div class="subtle">
        Bắt đầu từ:
        <span th:text="${timecreateAcc != null ? #temporals.format(timecreateAcc, 'dd/MM/yyyy') : '—'}">—</span>
    </div>

    <div class="chart-container">
        <h5 class="mt-2">📊 Chi tiêu theo thời gian</h5>
        <canvas id="spendingChart" width="400" height="200"></canvas>
    </div>

    <a th:href="@{/welcome}" class="back-home"><i class="bi bi-arrow-left-circle"></i> Quay lại trang chủ</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    const labels = /*[[${labels}]]*/ [];
    const spendingData = /*[[${spendingData}]]*/ [];

    const ctx = document.getElementById('spendingChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Tổng chi tiêu (₫)',
                data: spendingData,
                borderColor: '#00ffcc',
                backgroundColor: 'rgba(0,255,204,0.3)',
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            plugins: { legend: { labels: { color: '#fff' } } },
            scales: {
                x: { ticks: { color: '#fff' } },
                y: {
                    ticks: {
                        color: '#fff',
                        callback: function(v){ try{return v.toLocaleString('vi-VN')+'₫';}catch(e){return v;} }
                    }
                }
            }
        }
    });
</script>
</body>
</html>
