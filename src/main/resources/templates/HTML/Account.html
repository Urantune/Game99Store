<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>📝 Gửi yêu cầu hỗ trợ - GameStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #19002b 0%, #0a0a0a 100%);
            color: #f0f0f0;
            font-family: "Segoe UI", "Roboto", sans-serif;
            min-height: 100vh;
            padding: 80px 0;
        }
        .container {
            max-width: 600px;
        }
        h2 {
            text-align: center;
            font-weight: 600;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(40,30,60,0.9);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 15px rgba(142, 45, 226, 0.4);
        }
        label {
            font-weight: 500;
            color: #ddd;
        }
        input, select, textarea {
            background: rgba(35,35,55,0.9);
            color: #fff;
            border: 1px solid rgba(150,80,255,0.4);
            border-radius: 8px;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #b96fff;
            box-shadow: 0 0 10px rgba(160,90,255,0.4);
            outline: none;
        }
        textarea {
            resize: none;
        }
        .btn-submit {
            background: linear-gradient(90deg, #8E2DE2, #4A00E0);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
            margin-top: 15px;
            width: 100%;
        }
        .btn-submit:hover {
            background: linear-gradient(90deg, #a85ff0, #6b2ae2);
            box-shadow: 0 0 20px rgba(142, 45, 226, 0.6);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Gửi yêu cầu hỗ trợ</h2>

    <div class="card">
        <form id="supportForm">
            <div class="mb-3">
                <label for="fromName">Tên của bạn</label>
                <input type="text" id="fromName" name="from_name" placeholder="Nhập tên" required>
            </div>
            <div class="mb-3">
                <label for="fromEmail">Email</label>
                <input type="email" id="fromEmail" name="from_email" placeholder="Nhập email" required>
            </div>
            <div class="mb-3">
                <label for="issueType">Loại vấn đề</label>
                <select id="issueType" name="issue_type" required>
                    <option value="">-- Chọn loại vấn đề --</option>
                    <option value="game_error">Game bị lỗi / Không chạy được</option>
                    <option value="payment_issue">Vấn đề thanh toán</option>
                    <option value="account_security">Tài khoản & Bảo mật</option>
                    <option value="other">Khác</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="issueDetails">Chi tiết vấn đề</label>
                <textarea id="issueDetails" name="issue_details" rows="5" placeholder="Mô tả chi tiết vấn đề..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Gửi yêu cầu</button>
        </form>
    </div>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
    emailjs.init("PBiaYvMLWpe-woLFT"); // Thay bằng User ID EmailJS của bạn

    document.getElementById("supportForm").addEventListener("submit", function(e){
        e.preventDefault();

        const issueSelect = document.getElementById("issueType");
        const selectedText = issueSelect.options[issueSelect.selectedIndex].text;

        const params = {
            from_name: document.getElementById("fromName").value,
            from_email: document.getElementById("fromEmail").value,
            issue_type: selectedText,
            issue_details: document.getElementById("issueDetails").value,
            time: new Date().toLocaleString()
        };

        emailjs.send("service_8v6zib9", "template_gobv9tl", params)
            .then(() => {
                alert("✅ Yêu cầu hỗ trợ của bạn đã được gửi! Chúng tôi sẽ phản hồi sớm.");
                document.getElementById("supportForm").reset();
            })
            .catch(err => {
                console.error(err);
                alert("❌ Gửi yêu cầu thất bại. Vui lòng thử lại!");
            });
    });

</script>

</body>
</html>
