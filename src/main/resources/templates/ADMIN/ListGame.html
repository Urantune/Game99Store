<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Game-Store | Admin - Game Manager</title>


    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>


    <link th:href="@{/assets/css/styles1.css}" rel="stylesheet"/>

    <style>
        :root {
            --bg-dark: #0f1c2e;
            --card-bg: #16273f;
            --text-soft: #b0bec5;
            --accent: #4f9eff;
        }
        html, body { height: 100%; background-color: var(--bg-dark); }
        .page-title { color: #fff; text-shadow: 0 0 10px rgba(79,158,255,.35); }

        .search-wrap {
            background: linear-gradient(135deg, #0b1b2f, #122544);
            border: 1px solid #1e3a8a; border-radius: 14px; padding: 14px;
        }
        .search-wrap .form-control, .search-wrap .form-select {
            background: #1b2c45; border: 1px solid rgba(255,255,255,.08); color: #fff;
        }
        .search-wrap .form-control::placeholder { color: #98a6ad; }
        .result-count { color: var(--text-soft); }

        /* Game row (thanh dài) */
        .game-row {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;
            color: #e7eef6;
            transition: transform .15s ease, box-shadow .15s ease, border-color .2s ease;
        }
        .game-row:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
            border-color: rgba(79,158,255,.35);
        }
        .game-cover {
            width: 72px; height: 72px; border-radius: 12px; object-fit: cover;
            border: 2px solid rgba(255,255,255,.12);
        }
        .game-title { font-weight: 700; color: #fff; }
        .game-meta { color: var(--text-soft); font-size: .925rem; }
        .badge-soft {
            background: rgba(79,158,255,.12); color: var(--accent); border: 1px solid rgba(79,158,255,.35);
        }
        .row-actions .btn { border-radius: 10px; }
        .collapse-inner {
            background: #102037; border-top: 1px dashed rgba(255,255,255,.14);
            border-bottom-left-radius: 14px; border-bottom-right-radius: 14px;
        }
        .label-soft { color: var(--text-soft); }

        .btn-edit {
            background: linear-gradient(90deg, #0ea5e9, #3b82f6); color: #fff; border: none;
        }
        .btn-infox {
            background: linear-gradient(90deg, #f59e0b, #f97316); color: #fff; border: none;
        }
        .price {
            font-weight: 700; color: #9be37f;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="page-title mb-0">🎮 Game Manager</h2>
        <a th:href="@{/welcomeAdmin}" href="/welcomeAdmin" class="btn btn-outline-light">
            <i class="bi bi-arrow-left me-1"></i> Về Admin
        </a>
    </div>


    <div class="search-wrap mb-3">
        <div class="row g-2">
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-search"></i></span>
                    <input id="searchInput" type="text" class="form-control" placeholder="Tìm theo tên game, ID, SKU...">
                </div>
            </div>
            <div class="col-6 col-md-3">
                <select id="categoryFilter" class="form-select">
                    <option value="">— Tất cả thể loại —</option>
                    <option>Action</option>
                    <option>RPG</option>
                    <option>Sports</option>
                    <option>Adventure</option>
                    <option>Strategy</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <select id="statusFilter" class="form-select">
                    <option value="">— Tất cả trạng thái —</option>
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="DELISTED">DELISTED</option>
                    <option value="COMING_SOON">COMING_SOON</option>
                </select>
            </div>
        </div>

        <div class="mt-2 d-flex justify-content-between align-items-center">
            <small class="result-count" id="resultCount">Đang tải...</small>
            <div class="d-flex gap-2">
                <button id="btnClear" class="btn btn-sm btn-outline-light"><i class="bi bi-x-circle"></i> Xóa lọc</button>
                <button id="btnReload" class="btn btn-sm btn-outline-info"><i class="bi bi-arrow-clockwise"></i> Tải lại</button>
                <a href="/welcomeAdmin/upload" class="btn btn-sm btn-success"><i class="bi bi-cloud-upload"></i> Upload Game</a>
            </div>
        </div>
    </div>


    <div id="gameList" class="vstack gap-3"></div>


    <nav class="mt-4 d-none" id="pagerNav">
        <ul class="pagination justify-content-center">
            <li class="page-item disabled"><span class="page-link">Prev</span></li>
            <li class="page-item active"><span class="page-link">1</span></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </nav>
</div>


<template id="gameRowTpl">
    <div class="game-row">
        <div class="p-3">
            <div class="d-flex align-items-center gap-3">
                <img class="game-cover" src="" alt="cover">
                <div class="flex-grow-1">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <span class="game-title"></span>
                        <span class="badge badge-soft rounded-pill small cat-badge"></span>
                        <span class="badge rounded-pill small status-badge"></span>
                    </div>
                    <div class="game-meta mt-1">
                        <span class="me-3"><i class="bi bi-upc-scan me-1"></i>SKU: <span class="meta-sku"></span></span>
                        <span class="me-3"><i class="bi bi-archive me-1"></i>Stock: <span class="meta-stock"></span></span>
                        <span class=""><i class="bi bi-clock me-1"></i>Cập nhật: <span class="meta-updated"></span></span>
                    </div>
                </div>
                <div class="text-end me-2">
                    <div class="price"><span class="meta-price"></span></div>
                    <small class="text-white-50">VND</small>
                </div>
                <div class="row-actions d-flex gap-2">
                    <a class="btn btn-edit btn-sm" href="#" target="_self">
                        <i class="bi bi-pencil-square me-1"></i> Edit
                    </a>
                    <button class="btn btn-infox btn-sm btn-toggle" type="button" data-bs-toggle="collapse" aria-expanded="false">
                        <i class="bi bi-info-circle me-1"></i> Xem info
                    </button>
                </div>
            </div>
        </div>
        <div class="collapse collapse-inner">
            <div class="p-3">
                <div class="row g-3">
                    <div class="col-md-3">
                        <div class="label-soft">Game ID</div>
                        <div class="fw-semibold text-white small meta-id"></div>
                    </div>
                    <div class="col-md-3">
                        <div class="label-soft">Tên</div>
                        <div class="fw-semibold text-white small meta-name"></div>
                    </div>
                    <div class="col-md-3">
                        <div class="label-soft">Category</div>
                        <div class="fw-semibold text-white small meta-category"></div>
                    </div>
                    <div class="col-md-3">
                        <div class="label-soft">Trạng thái</div>
                        <div class="fw-semibold text-white small meta-status"></div>
                    </div>

                    <div class="col-md-3">
                        <div class="label-soft">Ngày tạo</div>
                        <div class="fw-semibold text-white small meta-created"></div>
                    </div>
                    <div class="col-md-3">
                        <div class="label-soft">Ngày cập nhật</div>
                        <div class="fw-semibold text-white small meta-updated2"></div>
                    </div>
                    <div class="col-md-3">
                        <div class="label-soft">Giá</div>
                        <div class="fw-semibold text-white small"><span class="meta-price2"></span> VND</div>
                    </div>
                    <div class="col-md-3">
                        <div class="label-soft">Kho</div>
                        <div class="fw-semibold text-white small meta-stock2"></div>
                    </div>

                    <div class="col-12">
                        <div class="label-soft">Mô tả</div>
                        <div class="text-white-50 small meta-desc"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const MOCK_GAMES = [
        {
            id: "g-0001",
            name: "Cyber Raid",
            category: "Action",
            status: "ACTIVE",
            price: 299000,
            sku: "CR-ACT-001",
            stock: 120,
            createdAt: "2025-04-10",
            updatedAt: "2025-09-29",
            description: "FPS cyberpunk tốc độ cao, nhiều chế độ chơi.",
            cover: "/img/game3.jpg"
        },
        {
            id: "g-0002",
            name: "Dragon Quest X",
            category: "RPG",
            status: "COMING_SOON",
            price: 499000,
            sku: "DQ-RPG-010",
            stock: 0,
            createdAt: "2025-08-02",
            updatedAt: "2025-10-02",
            description: "Nhập vai thế giới mở, cốt truyện dài.",
            cover: "/img/game6.jpg"
        },
        {
            id: "g-0003",
            name: "Street Football 24",
            category: "Sports",
            status: "ACTIVE",
            price: 259000,
            sku: "SF-SPT-024",
            stock: 45,
            createdAt: "2024-12-11",
            updatedAt: "2025-06-14",
            description: "Bóng đá đường phố 5v5, gameplay nhanh và lạ.",
            cover: "/img/game3.jpg"
        },
        {
            id: "g-0004",
            name: "Mystic Island",
            category: "Adventure",
            status: "DELISTED",
            price: 199000,
            sku: "MI-ADV-003",
            stock: 0,
            createdAt: "2023-05-03",
            updatedAt: "2025-03-19",
            description: "Phiêu lưu giải đố trên đảo huyền bí.",
            cover: "/img/game6.jpg"
        }
    ];


    const EDIT_LINK_TEMPLATE = '/welcomeAdmin/editgame?id={{id}}';


    const listEl = document.getElementById('gameList');
    const rowTpl = document.getElementById('gameRowTpl');

    function statusBadgeClass(stt) {
        switch ((stt || '').toUpperCase()) {
            case 'ACTIVE': return 'bg-success';
            case 'DELISTED': return 'bg-danger';
            case 'COMING_SOON': return 'bg-warning text-dark';
            default: return 'bg-secondary';
        }
    }
    function currency(n) {
        if (n === null || n === undefined) return '0';
        return n.toLocaleString('vi-VN');
    }

    function renderGames(games) {
        listEl.innerHTML = '';
        games.forEach((g, idx) => {
            const node = rowTpl.content.cloneNode(true);
            const root = node.firstElementChild;


            root.querySelector('.game-cover').src = g.cover || '/img/game3.jpg';
            root.querySelector('.game-title').textContent = g.name || 'N/A';
            root.querySelector('.cat-badge').textContent = g.category || 'N/A';

            const statusEl = root.querySelector('.status-badge');
            statusEl.textContent = g.status || 'UNKNOWN';
            statusEl.classList.add(statusBadgeClass(g.status));

            root.querySelector('.meta-sku').textContent = g.sku || '';
            root.querySelector('.meta-stock').textContent = g.stock ?? 0;
            root.querySelector('.meta-updated').textContent = g.updatedAt || '';
            root.querySelector('.meta-price').textContent = currency(g.price);


            const editBtn = root.querySelector('.btn-edit');
            editBtn.href = EDIT_LINK_TEMPLATE.replace('{{id}}', encodeURIComponent(g.id));


            const collapseEl = root.querySelector('.collapse-inner');
            const collapseId = `collapse_game_${idx}`;
            collapseEl.id = collapseId;
            const toggleBtn = root.querySelector('.btn-toggle');
            toggleBtn.setAttribute('data-bs-target', `#${collapseId}`);
            toggleBtn.setAttribute('aria-controls', collapseId);


            root.querySelector('.meta-id').textContent = g.id || '';
            root.querySelector('.meta-name').textContent = g.name || '';
            root.querySelector('.meta-category').textContent = g.category || '';
            root.querySelector('.meta-status').textContent = g.status || '';
            root.querySelector('.meta-created').textContent = g.createdAt || '';
            root.querySelector('.meta-updated2').textContent = g.updatedAt || '';
            root.querySelector('.meta-price2').textContent = currency(g.price);
            root.querySelector('.meta-stock2').textContent = g.stock ?? 0;
            root.querySelector('.meta-desc').textContent = g.description || '';

            listEl.appendChild(node);
        });

        document.getElementById('resultCount').textContent =
            `Tổng: ${games.length} game`;
    }

    // ===== SEARCH / FILTER =====
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const statusFilter = document.getElementById('statusFilter');
    const btnClear = document.getElementById('btnClear');
    const btnReload = document.getElementById('btnReload');

    function normalize(v) { return (v || '').toString().toLowerCase().trim(); }

    function applyFilter() {
        const q = normalize(searchInput.value);
        const cat = categoryFilter.value;
        const stt = statusFilter.value;

        const filtered = MOCK_GAMES.filter(g => {
            const matchesQ =
                !q ||
                normalize(g.name).includes(q) ||
                normalize(g.id).includes(q) ||
                normalize(g.sku).includes(q);
            const matchesCat = !cat || (g.category || '').toLowerCase() === cat.toLowerCase();
            const matchesStt = !stt || (g.status || '').toUpperCase() === stt.toUpperCase();
            return matchesQ && matchesCat && matchesStt;
        });

        renderGames(filtered);
    }

    searchInput.addEventListener('input', applyFilter);
    categoryFilter.addEventListener('change', applyFilter);
    statusFilter.addEventListener('change', applyFilter);
    btnClear.addEventListener('click', () => {
        searchInput.value = ''; categoryFilter.value = ''; statusFilter.value = '';
        applyFilter();
    });
    btnReload.addEventListener('click', () => {

        applyFilter();
    });


    renderGames(MOCK_GAMES);
</script>

</body>
</html>
