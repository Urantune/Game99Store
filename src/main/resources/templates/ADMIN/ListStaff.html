<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Game-Store | Admin - List Staff</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/assets/css/styles1.css}" rel="stylesheet"/>

    <style>
        :root { --bg-dark:#0f1c2e; --card-bg:#16273f; --text-soft:#b0bec5; --accent:#4f9eff; }
        html,body{height:100%;background-color:var(--bg-dark)}
        .page-title{color:#fff;text-shadow:0 0 10px rgba(79,158,255,.35)}
        .search-wrap{background:linear-gradient(135deg,#0b1b2f,#122544);border:1px solid #1e3a8a;border-radius:14px;padding:14px}
        .search-wrap .form-control{background:#1b2c45;border:1px solid rgba(255,255,255,.08);color:#fff}
        .search-wrap .form-control::placeholder{color:#98a6ad}
        .result-count{color:var(--text-soft)}
        .staff-row{background:var(--card-bg);border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#e7eef6;transition:transform .15s ease,box-shadow .15s ease,border-color .2s ease}
        .staff-row:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35);border-color:rgba(79,158,255,.35)}
        .staff-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.15)}
        .staff-name{font-weight:700;color:#fff}
        .staff-meta{color:var(--text-soft);font-size:.925rem}
        .badge-soft{background:rgba(79,158,255,.12);color:var(--accent);border:1px solid rgba(79,158,255,.35)}
        .row-actions .btn{border-radius:10px}
        .collapse-inner{background:#102037;border-top:1px dashed rgba(255,255,255,.14);border-bottom-left-radius:14px;border-bottom-right-radius:14px}
        .label-soft{color:var(--text-soft)}
        .btn-edit{background:linear-gradient(90deg,#0ea5e9,#3b82f6);color:#fff;border:none}
        .btn-infox{background:linear-gradient(90deg,#f59e0b,#f97316);color:#fff;border:none}
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="page-title mb-0">🧑‍💼 Danh sách Staff</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/welcomeAdmin}" class="btn btn-outline-light">
                <i class="bi bi-arrow-left me-1"></i> Về Admin
            </a>
            <a th:href="@{/welcomeAdmin/staff/form}" class="btn btn-success">
                <i class="bi bi-person-plus-fill me-1"></i> Thêm Staff
            </a>
        </div>
    </div>

    <div class="search-wrap mb-3">
        <div class="row g-2 align-items-center">
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-white-50">
                        <i class="bi bi-search"></i>
                    </span>
                    <input id="searchInput" type="text" class="form-control" placeholder="Tìm theo username...">
                </div>
            </div>
            <div class="col-6 col-md-3">
                <select id="statusFilter" class="form-select">
                    <option value="">— Tất cả trạng thái —</option>
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="DISABLED">DISABLED</option>
                </select>
            </div>
        </div>
        <div class="mt-2 d-flex justify-content-between align-items-center">
            <small class="result-count" id="resultCount"
                   th:text="'Tổng: ' + ${#lists.size(staffList)} + ' staff'">Đang tải...</small>
            <div class="d-flex gap-2">
                <button id="btnClear" class="btn btn-sm btn-outline-light"><i class="bi bi-x-circle"></i> Xóa lọc</button>
                <button id="btnReload" class="btn btn-sm btn-outline-info" onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise"></i> Tải lại
                </button>
            </div>
        </div>
    </div>

    <div id="staffList" class="vstack gap-3">
        <div class="staff-row"
             th:each="s, iStat : ${staffList}"
             th:with="created=${s.dateCreateAcc}"
             th:attr="data-username=${s.adminName},
                      data-status=${s.status}">
            <div class="p-3">
                <div class="d-flex align-items-center gap-3">
                    <img class="staff-avatar"
                         th:src="${s.imageLinks != null && !#strings.isEmpty(s.imageLinks)} ? ${s.imageLinks} : '/img/a.png'"
                         src="/img/a.png" alt="avatar">

                    <div class="flex-grow-1">
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <span class="staff-name" th:text="${s.adminName}">staffname</span>

                            <span class="badge badge-soft rounded-pill small"
                                  th:text="${s.role != null ? s.role : 'STAFF'}">STAFF</span>

                            <span class="badge rounded-pill small"
                                  th:classappend="${s.status} == 'ACTIVE' ? ' bg-success' :
                                                  (${s.status} == 'DISABLED' ? ' bg-danger' : ' bg-secondary')"
                                  th:text="${s.status != null ? s.status : 'UNKNOWN'}">STATUS</span>
                        </div>

                        <div class="staff-meta mt-1">
                            <span>
                                <i class="bi bi-clock me-1"></i>
                                Tạo:
                                <span th:text="${created != null ? #temporals.format(created, 'yyyy-MM-dd HH:mm') : '—'}">—</span>
                            </span>
                        </div>
                    </div>

                    <div class="row-actions d-flex gap-2">
                        <a class="btn btn-edit btn-sm"
                           th:href="@{/welcomeAdmin/staff/form(id=${s.adminid})}">
                            <i class="bi bi-pencil-square me-1"></i> Edit
                        </a>
                        <button class="btn btn-infox btn-sm btn-toggle" type="button"
                                data-bs-toggle="collapse" th:attr="data-bs-target='#c_'+${iStat.index}"
                                th:attrappend=" aria-controls='c_'+${iStat.index}">
                            <i class="bi bi-info-circle me-1"></i> Xem info
                        </button>
                    </div>
                </div>
            </div>

            <div class="collapse collapse-inner" th:id="'c_'+${iStat.index}">
                <div class="p-3">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="label-soft">Admin ID</div>
                            <div class="fw-semibold text-white small" th:text="${s.adminid}">uuid</div>
                        </div>
                        <div class="col-md-4">
                            <div class="label-soft">Username</div>
                            <div class="fw-semibold text-white small" th:text="${s.adminName}">username</div>
                        </div>
                        <div class="col-md-4">
                            <div class="label-soft">Status</div>
                            <div class="fw-semibold text-white small" th:text="${s.status}">status</div>
                        </div>

                        <div class="col-md-6">
                            <div class="label-soft">Avatar Link</div>
                            <div class="text-white-50 small text-truncate" th:text="${s.imageLinks}">/img/default-avatar.png</div>
                        </div>

                        <div class="col-12">
                            <div class="label-soft">Ngày tạo</div>
                            <div class="text-white-50 small"
                                 th:text="${s.dateCreateAcc != null ? #temporals.format(s.dateCreateAcc, 'yyyy-MM-dd HH:mm:ss') : '—'}">—</div>
                        </div>
                    </div>
                </div>
            </div>

        </div><!-- /staff-row -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const btnClear = document.getElementById('btnClear');

    function normalize(v){ return (v||'').toString().toLowerCase().trim(); }

    function applyFilter(){
        const q = normalize(searchInput.value);
        const st = normalize(statusFilter.value);

        const rows = document.querySelectorAll('.staff-row');
        let visible = 0;

        rows.forEach(row => {
            const username = normalize(row.getAttribute('data-username'));
            const status = normalize(row.getAttribute('data-status'));
            const matchesQ = !q || username.includes(q);
            const matchesStatus = !st || status === st;
            const show = matchesQ && matchesStatus;
            row.style.display = show ? '' : 'none';
            if (show) visible++;
        });

        const rc = document.getElementById('resultCount');
        if (rc) rc.textContent = 'Tổng: ' + visible + ' staff';
    }

    searchInput.addEventListener('input', applyFilter);
    statusFilter.addEventListener('change', applyFilter);
    btnClear.addEventListener('click', () => { searchInput.value=''; statusFilter.value=''; applyFilter(); });

    applyFilter();
</script>
<script th:src="@{/Accest/JS/code.js}"></script>
</body>
</html>
