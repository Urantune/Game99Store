<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Upload Game | GameStore Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

    <style>
        body{background:#0f1c2e;color:#fff;font-family:Poppins,sans-serif}
        .cardx{background:#1a2742;border:none;border-radius:14px;padding:20px;box-shadow:0 0 15px rgba(0,150,255,.15)}
        .media-big{width:100%;max-height:420px;border-radius:14px;object-fit:cover}
        .media-thumb{width:100%;height:160px;border-radius:12px;object-fit:cover}
        .form-control,.form-select{background:#243447;color:#fff;border:none}
        textarea.form-control{min-height:150px}
        .btn-save{background:linear-gradient(90deg,#22c55e,#16a34a);color:#fff;border:none}
    </style>
</head>

<body>

<div class="container py-4">

    <h3 class="mb-3">Upload Game mới</h3>

    <!-- PREVIEW BOX -->
    <div class="cardx mb-4">
        <div class="row g-3">
            <div class="col-lg-7">
                <!-- Ảnh COVER -->
                <img id="previewCover" class="media-big" src="/img/placeholder.jpg" alt="cover">
            </div>
            <div class="col-lg-5">
                <!-- VIDEO -->
                <video id="previewVideo" class="media-big d-none" controls></video>

                <div class="row g-2 mt-2">
                    <div class="col-4">
                        <img id="previewImg1" class="media-thumb" src="/img/placeholder.jpg" alt="img1">
                    </div>
                    <div class="col-4">
                        <img id="previewImg2" class="media-thumb" src="/img/placeholder.jpg" alt="img2">
                    </div>
                    <div class="col-4">
                        <img id="previewImg3" class="media-thumb" src="/img/placeholder.jpg" alt="img3">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FORM UPLOAD GAME -->
    <form th:action="@{/welcomeAdmin/upload}" method="post"
          enctype="multipart/form-data" class="cardx" id="uploadForm">

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Tên game</label>
                <input class="form-control" name="gameName" required/>
            </div>

            <div class="col-md-3">
                <label class="form-label">Giá</label>
                <input class="form-control" name="price" type="number" step="0.01" required/>
            </div>

            <div class="col-md-3">
                <label class="form-label">Phiên bản</label>
                <input class="form-control" name="version"/>
            </div>

            <div class="col-md-6">
                <label class="form-label">Thể loại</label>
                <input class="form-control" name="category" required/>
            </div>

            <div class="col-md-6">
                <label class="form-label">Trạng thái</label>
                <select name="status" class="form-select">
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="COMING_SOON">COMING_SOON</option>
                    <option value="DELISTED">DELISTED</option>
                </select>
            </div>

            <!-- Mô tả -->
            <div class="col-12">
                <label class="form-label">Mô tả từng phần</label>
                <textarea class="form-control" name="dec_1" placeholder="Mô tả chính" required></textarea>
            </div>

            <div class="col-md-6"><input class="form-control" name="dec_2" placeholder="Ý phụ 1"/></div>
            <div class="col-md-6"><input class="form-control" name="dec_3" placeholder="Ý phụ 2"/></div>
            <div class="col-md-6"><input class="form-control" name="dec_4" placeholder="Ý phụ 3"/></div>
            <div class="col-md-6"><input class="form-control" name="dec_5" placeholder="Ý phụ 4"/></div>

        </div>

        <!-- FILE INPUTS -->
        <div class="mt-4 row g-3">

            <div class="col-12">
                <label class="form-label">Video (.mp4)</label>
                <input class="form-control" type="file" name="img_video" accept="video/*" id="inputVideo"/>
            </div>

            <div class="col-md-4">
                <label class="form-label">Ảnh phụ 1</label>
                <input class="form-control" type="file" name="img_1" accept="image/*" id="inputImg1"/>
            </div>
            <div class="col-md-4">
                <label class="form-label">Ảnh phụ 2</label>
                <input class="form-control" type="file" name="img_2" accept="image/*" id="inputImg2"/>
            </div>
            <div class="col-md-4">
                <label class="form-label">Ảnh phụ 3</label>
                <input class="form-control" type="file" name="img_3" accept="image/*" id="inputImg3"/>
            </div>

            <div class="col-12">
                <label class="form-label">Ảnh cover</label>
                <input class="form-control" type="file" name="img_cover" accept="image/*" required id="inputCover"/>
            </div>

            <div class="col-12">
                <label class="form-label">File game (.zip/.rar/.7z/.iso)</label>
                <input class="form-control" type="file" name="packageFile" accept=".zip,.rar,.7z,.iso" required/>
            </div>
        </div>

        <button type="submit" class="btn btn-save mt-4 w-100">
            <i class="bi bi-upload"></i> Tải game lên
        </button>
    </form>
</div>

<!-- TOASTS (Success + Error) -->
<div class="position-fixed top-0 end-0 p-3" style="z-index:1100">
    <div id="toastSuccess" class="toast text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <i class="bi bi-check-circle-fill me-2 text-success"></i>
            <strong class="me-auto">Thành công</strong>
            <small>just now</small>
            <button type="button" class="btn-close btn-close-white ms-2 mb-1" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastSuccessBody">Upload thành công!</div>
    </div>

    <div id="toastError" class="toast text-bg-danger border-0 mt-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>
            <strong class="me-auto">Lỗi</strong>
            <small>just now</small>
            <button type="button" class="btn-close btn-close-white ms-2 mb-1" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="toastErrorBody">Đã có lỗi xảy ra.</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Preview ảnh/video
    function previewImage(input, imgTag) {
        input.addEventListener("change", () => {
            if (input.files && input.files[0]) {
                imgTag.src = URL.createObjectURL(input.files[0]);
            }
        });
    }
    function previewVideo(input, tag) {
        input.addEventListener("change", () => {
            if (input.files && input.files[0]) {
                tag.classList.remove("d-none");
                tag.src = URL.createObjectURL(input.files[0]);
            }
        });
    }
    previewImage(document.getElementById("inputCover"), document.getElementById("previewCover"));
    previewImage(document.getElementById("inputImg1"), document.getElementById("previewImg1"));
    previewImage(document.getElementById("inputImg2"), document.getElementById("previewImg2"));
    previewImage(document.getElementById("inputImg3"), document.getElementById("previewImg3"));
    previewVideo(document.getElementById("inputVideo"), document.getElementById("previewVideo"));

    // Submit AJAX + Toast
    (function() {
        const form = document.getElementById('uploadForm');
        const successToastEl = document.getElementById('toastSuccess');
        const errorToastEl   = document.getElementById('toastError');
        const successToast   = new bootstrap.Toast(successToastEl, { delay: 3000 });
        const errorToast     = new bootstrap.Toast(errorToastEl,   { delay: 4000 });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const fd = new FormData(form);
                const res = await fetch(form.getAttribute('action'), { method: 'POST', body: fd });

                const text = await res.text();
                if (!res.ok) {
                    document.getElementById('toastErrorBody').textContent = text || 'Upload thất bại';
                    errorToast.show();
                    return;
                }

                // Thành công
                document.getElementById('toastSuccessBody').textContent = text || 'Upload thành công!';
                successToast.show();

                // Reset form + preview
                form.reset();
                document.getElementById('previewCover').src = '/img/placeholder.jpg';
                document.getElementById('previewImg1').src  = '/img/placeholder.jpg';
                document.getElementById('previewImg2').src  = '/img/placeholder.jpg';
                document.getElementById('previewImg3').src  = '/img/placeholder.jpg';
                const video = document.getElementById('previewVideo');
                video.classList.add('d-none');
                video.removeAttribute('src');
                video.load();

            } catch (err) {
                document.getElementById('toastErrorBody').textContent = err?.message || 'Lỗi không xác định';
                errorToast.show();
            }
        });
    })();
</script>
<script th:src="@{/Accest/JS/code.js}"></script>
</body>
</html>
