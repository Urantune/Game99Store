<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Create/Edit Voucher | GameStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body{background:#0f1c2e;color:#fff;font-family:Poppins,sans-serif}
        .cardx{background:#1a2742;border:none;border-radius:14px;padding:20px}
        .form-control,.form-select{background:#243447;color:#fff;border:none}
        .btn-save{background:linear-gradient(90deg,#22c55e,#16a34a);color:#fff;border:none}
        .btn-outline{border-color:rgba(255,255,255,.25)!important;color:#cfe1ff}
    </style>
</head>
<body>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 th:text="${mode=='edit' ? 'Edit Voucher' : 'Create Voucher'}"></h3>
        <div class="d-flex gap-2">
            <a th:href="@{/welcomeAdmin/listvoucher}" class="btn btn-outline">danh sách</a>
            <a th:href="@{/welcomeAdmin}" class="btn btn-outline-light">quay lại</a>
        </div>
    </div>

    <form th:action="@{/welcomeAdmin/voucher/save}" method="post" class="cardx">

        <input type="hidden" name="voucherId" th:value="${voucher.voucherid}"/>

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Tên voucher</label>
                <input class="form-control" name="name" th:value="${voucher.name}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Giảm (sale)</label>
                <input class="form-control" type="number" step="0.01" min="0"
                       name="sale" th:value="${voucher.sale}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Loại</label>
                <select class="form-select" name="type">
                    <option value="percent" th:selected="${voucher.type=='percent'}">Giảm %</option>
                    <option value="fixed" th:selected="${voucher.type=='fixed'}">Giảm tiền</option>
                    <option value="shipping" th:selected="${voucher.type=='shipping'}">Giảm ship</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Ngày hiệu lực</label>
                <input class="form-control" type="date" name="date_start"
                       th:value="${voucher.date_start != null ? #temporals.format(voucher.date_start,'yyyy-MM-dd') : ''}"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Ngày hết hạn</label>
                <input class="form-control" type="date" name="date_end"
                       th:value="${voucher.date_end != null ? #temporals.format(voucher.date_end,'yyyy-MM-dd') : ''}"
                       required>
            </div>


            <div class="col-12 mt-3">
                <label class="form-label">Người dùng được sử dụng voucher này</label>

                <div class="border rounded p-2" style="max-height:220px; overflow-y:auto; background:#243447;">
                    <div class="form-check mb-1"
                         th:each="u : ${allUsers}">
                        <input class="form-check-input"
                               type="checkbox"
                               th:id="${'user-' + u.id}"
                               name="userIds"
                               th:value="${u.id}"
                               th:checked="${selectedUserIds != null and selectedUserIds.contains(u.id)}">
                        <label class="form-check-label" th:for="${'user-' + u.id}"
                               th:text="${u.username + ' (' + u.email + ')'}"></label>
                    </div>
                </div>

                <small class="text-muted">
                    Tick để cho phép user dùng voucher này.
                </small>
            </div>



            <div class="col-12 mt-3">
                <label class="form-label">Game được áp dụng voucher này</label>

                <div class="border rounded p-2" style="max-height:220px; overflow-y:auto; background:#243447;">
                    <div class="form-check mb-1"
                         th:each="g : ${allGames}">
                        <input class="form-check-input"
                               type="checkbox"
                               th:id="${'game-' + g.gameId}"
                               name="gameIds"
                               th:value="${g.gameId}"
                               th:checked="${selectedGameIds != null and selectedGameIds.contains(g.gameId)}">
                        <label class="form-check-label" th:for="${'game-' + g.gameId}"
                               th:text="${g.gameName}"></label>
                    </div>
                </div>

                <small class="text-muted">
                    Tick các game được phép dùng voucher này.
                </small>
            </div>


        </div>

        <button class="btn btn-save mt-4 w-100">
            <span th:text="${mode=='edit' ? 'Cập nhật' : 'Tạo mới'}"></span>
        </button>

    </form>

</div>
<script th:src="@{/Accest/JS/code.js}"></script>
</body>

</html>
