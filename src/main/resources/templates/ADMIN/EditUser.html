<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit User | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body{background:#0f1c2e;color:#fff;font-family:Poppins,sans-serif}
        .card{background:#1a2742;border:none;border-radius:14px;padding:20px;box-shadow:0 0 15px rgba(0,150,255,.15)}
        .card h3{color:#4f9eff;text-shadow:0 0 5px #4f9eff}
        .form-control{background:#2c3e50;border:none;color:#fff;border-radius:10px}
        .btn-action{border-radius:10px}
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card mx-auto" style="max-width:640px;">
        <h3 class="text-center mb-4">Edit User Profile</h3>

        <!-- Save username + email -->
        <form th:action="@{/welcomeAdmin/edituser/{id}(id=${id})}" th:object="${user}" method="post" class="mb-4">
            <input type="hidden" th:field="*{id}"/>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" th:field="*{username}" placeholder="Nhập username">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" th:field="*{email}" placeholder="Nhập email">
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/welcomeAdmin/listuser}" class="btn btn-outline-light btn-action">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
                <button type="submit" class="btn btn-success btn-action ms-auto">
                    <i class="bi bi-save-fill me-1"></i> Save
                </button>
            </div>
        </form>

        <hr>

        <!-- Reset password (optional) -->
        <form th:action="@{/welcomeAdmin/users/{id}/reset-password(id=${id})}" method="post" class="mb-3">
            <label class="form-label">New Password</label>
            <div class="input-group">
                <input class="form-control" id="genPwd" name="newPassword" readonly>
                <button type="button" class="btn btn-secondary" id="btnGen"><i class="bi bi-shuffle"></i></button>
                <button type="submit" class="btn btn-warning">Apply</button>
            </div>
        </form>

        <div class="d-flex gap-2">
            <form th:action="@{/welcomeAdmin/users/{id}/ban(id=${id})}" method="post">
                <button type="submit" class="btn btn-warning btn-action">
                    <i class="bi bi-slash-circle me-1"></i> Ban Account
                </button>
            </form>
            <form th:action="@{/welcomeAdmin/users/{id}/delete(id=${id})}" method="post" class="ms-auto"
                  onsubmit="return confirm('Xóa vĩnh viễn tài khoản này?');">
                <button type="submit" class="btn btn-danger btn-action">
                    <i class="bi bi-trash-fill me-1"></i> Delete Account
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('btnGen').onclick = function () {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';
        let out = '';
        for (let i = 0; i < 12; i++) out += chars[Math.floor(Math.random() * chars.length)];
        document.getElementById('genPwd').value = out;
    };
</script>
</body>
</html>
