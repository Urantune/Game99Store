<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit User | GameStore Admin</title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #0f1c2e;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            background-color: #1a2742;
            border: none;
            border-radius: 14px;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.15);
            padding: 20px;
        }

        .card h3 {
            color: #4f9eff;
            text-shadow: 0 0 5px #4f9eff;
        }

        .form-control {
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 10px;
        }

        .form-control:focus {
            border: 1px solid #00e0ff;
            box-shadow: 0 0 8px rgba(0, 224, 255, 0.5);
        }

        .btn-save {
            background: linear-gradient(90deg, #198754, #28a745);
            color: white;
            border: none;
            border-radius: 10px;
            transition: all .3s ease;
        }

        .btn-save:hover {
            background: linear-gradient(90deg, #28a745, #34ce57);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(40,167,69,.8);
        }

        .btn-back {
            background-color: #6c757d;
            border: none;
            border-radius: 10px;
            color: white;
        }

        .btn-back:hover {
            background-color: #adb5bd;
            color: black;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #4f9eff;
            object-fit: cover;
        }

    </style>
</head>
<body>

<nav class="navbar navbar-dark" style="background-color:#0f1c2e;">
    <div class="container-fluid">
        <a th:href="@{/welcomeAdmin}" class="navbar-brand fw-bold text-primary">🎮 GameStore Admin</a>
        <a th:href="@{/welcomeAdmin}" class="btn btn-outline-light">Back to Dashboard</a>
    </div>
</nav>

<div class="container py-5">
    <div class="card mx-auto" style="max-width: 650px;">
        <h3 class="text-center mb-4">Edit User Information</h3>

        <form th:action="@{/welcomeAdmin/edituser/{id}(id = ${id})}" th:object="${user}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}"/>

            <div class="text-center mb-3">
                <img th:src="${user.avatar != null ? user.avatar : '/img/default-avatar.png'}"
                     alt="Avatar" class="avatar-preview mb-2">
                <div>
                    <label class="form-label text-info">Change Avatar</label>
                    <input type="file" name="avatarFile" class="form-control" accept="image/*">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" th:field="*{username}" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" th:field="*{fullname}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" th:field="*{phone}">
            </div>

            <div class="mb-3">
                <label class="form-label">Role</label>
                <select class="form-control" th:field="*{role}">
                    <option value="USER">User</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/welcomeAdmin/edituser}" class="btn btn-back px-4">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
                <button type="submit" class="btn btn-save px-4">
                    <i class="bi bi-save-fill"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

<footer class="text-center text-white-50 mt-5 mb-3">
    © 2025 <span class="text-primary fw-bold">GameStore</span> | Admin System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
