<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Staff | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body{background:#0f1c2e;color:#fff;font-family:Poppins,sans-serif}
        .card{background:#1a2742;border:none;border-radius:14px;padding:20px;box-shadow:0 0 15px rgba(0,150,255,.15)}
        .card h3{color:#4f9eff;text-shadow:0 0 5px #4f9eff}
        .form-control{background:#2c3e50;border:none;color:#fff;border-radius:10px}
        .btn-action{border-radius:10px}
        .badge-status{font-size:.8rem}
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card mx-auto" style="max-width:640px;">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0"
                th:text="${mode == 'create'} ? 'Create Staff Account' : 'Edit Staff Account'">
                Edit Staff Account
            </h3>
            <span class="badge badge-status"
                  th:classappend="${staff.status} == 'ACTIVE' ? ' bg-success' :
                                  (${staff.status} == 'DISABLED' ? ' bg-danger' : ' bg-secondary')"
                  th:text="${staff.status != null ? staff.status : 'NEW'}">STATUS</span>
        </div>

        <!-- FORM SAVE STAFF -->
        <form th:action="@{/welcomeAdmin/staff/save}" method="post" class="mb-4">
            <input type="hidden" name="id" th:value="${staff.adminid}"/>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control"
                       name="username"
                       th:value="${staff.adminName}"
                       placeholder="Nhập username staff" required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Password
                    <small class="text-white-50">(để trống nếu không đổi)</small>
                </label>
                <div class="input-group">
                    <input class="form-control" id="genPwd" name="rawPassword" placeholder="Nhập hoặc bấm Shuffle để tạo">
                    <button type="button" class="btn btn-secondary" id="btnGen">
                        <i class="bi bi-shuffle"></i>
                    </button>
                </div>
                <div class="form-text text-white-50">
                    Admin sẽ gửi mật khẩu này cho staff. Khi save, hệ thống sẽ lưu dạng mã hóa.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="ACTIVE"
                            th:selected="${staff.status} == 'ACTIVE' or staff.status == null">ACTIVE</option>
                    <option value="DISABLED"
                            th:selected="${staff.status} == 'DISABLED'">DISABLED</option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/welcomeAdmin/staff/list}" class="btn btn-outline-light btn-action">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
                <button type="submit" class="btn btn-success btn-action ms-auto">
                    <i class="bi bi-save-fill me-1"></i>
                    <span th:text="${mode == 'create'} ? 'Create Staff' : 'Save Changes'">Save</span>
                </button>
            </div>
        </form>

        <hr th:if="${mode == 'edit'}"/>

        <div th:if="${mode == 'edit'}" class="d-flex flex-column gap-2">

            <!-- Toggle status ACTIVE/DISABLED -->
            <form th:action="@{/welcomeAdmin/staff/toggle-status}" method="post" class="d-inline">
                <input type="hidden" name="id" th:value="${staff.adminid}"/>
                <button type="submit"
                        class="btn btn-warning btn-action w-100 mb-2"
                        th:if="${staff.status == 'ACTIVE'}">
                    <i class="bi bi-slash-circle me-1"></i> Disable Account
                </button>
                <button type="submit"
                        class="btn btn-success btn-action w-100 mb-2"
                        th:if="${staff.status == 'DISABLED'}">
                    <i class="bi bi-unlock-fill me-1"></i> Enable Account
                </button>
            </form>

            <!-- Reset password: dùng lại field rawPassword -->
            <form th:action="@{/welcomeAdmin/staff/reset-password}" method="post" class="d-inline">
                <input type="hidden" name="id" th:value="${staff.adminid}"/>
                <input type="hidden" name="newPassword" id="hiddenNewPwd">
                <button type="button" class="btn btn-primary btn-action w-100"
                        onclick="submitResetStaffPwd()">
                    <i class="bi bi-key-fill me-1"></i> Reset password (dùng mật khẩu hiện ở ô trên)
                </button>
            </form>

        </div>

    </div>
</div>

<script>
    document.getElementById('btnGen').onclick = function () {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';
        let out = '';
        for (let i = 0; i < 12; i++) out += chars[Math.floor(Math.random() * chars.length)];
        document.getElementById('genPwd').value = out;
    };

    function submitResetStaffPwd() {
        const pwd = document.getElementById('genPwd').value.trim();
        if (!pwd) {
            alert('Hãy nhập hoặc tạo mật khẩu trong ô Password trước.');
            return;
        }
        document.getElementById('hiddenNewPwd').value = pwd;
        // form reset-password là form cuối cùng trong card
        document.querySelector('form[action$="staff/reset-password"]').submit();
    }
</script>
<script th:src="@{/Accest/JS/code.js}"></script>
</body>
</html>
