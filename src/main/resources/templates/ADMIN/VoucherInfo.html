<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Voucher Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body{background:#0f1c2e;color:#fff}
        .cardx{background:#16273f;border-radius:14px;padding:20px;border:none}
        th,td{vertical-align:middle!important}
    </style>
</head>
<body>
<div class="container py-4">

    <div class="d-flex justify-content-between mb-3">
        <h3>Thông tin voucher</h3>
        <div>
            <a th:href="@{/welcomeAdmin/listvoucher}" class="btn btn-outline-light btn-sm">quay lại danh sách</a>
        </div>
    </div>

    <div class="cardx mb-4">
        <h5 th:text="${voucher.name}"></h5>
        <div class="small text-secondary" th:text="${voucher.voucherid}"></div>
        <div class="mt-2">
            <div>Loại: <span th:text="${voucher.type}"></span></div>
            <div>Giảm: <span th:text="${voucher.sale}"></span></div>
            <div>Hiệu lực:
                <span th:text="${#temporals.format(voucher.date_start,'yyyy-MM-dd HH:mm')}"></span>
                &nbsp;→&nbsp;
                <span th:text="${#temporals.format(voucher.date_end,'yyyy-MM-dd HH:mm')}"></span>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <!-- User đang được dùng mã -->
        <div class="col-md-6">
            <div class="cardx h-100">
                <h5 class="mb-3">User được dùng mã này</h5>
                <table class="table table-sm table-dark table-striped align-middle mb-0" th:if="${#lists.size(users) > 0}">
                    <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Ngày nhận</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="vu : ${users}">
                        <td th:text="${vu.user.username}"></td>
                        <td th:text="${vu.user.email}"></td>
                        <td th:text="${#temporals.format(vu.date_received,'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
                <div th:if="${#lists.size(users) == 0}" class="text-secondary">
                    Chưa có user nào nhận voucher này.
                </div>
            </div>
        </div>

        <!-- Game được áp dụng mã -->
        <div class="col-md-6">
            <div class="cardx h-100">
                <h5 class="mb-3">Game được áp dụng voucher</h5>
                <table class="table table-sm table-dark table-striped align-middle mb-0" th:if="${#lists.size(games) > 0}">
                    <thead>
                    <tr>
                        <th>Tên game</th>
                        <th>Thể loại</th>
                        <th>Trạng thái game</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="vg : ${games}">
                        <td th:text="${vg.game.gameName}"></td>
                        <td th:text="${vg.game.gameCategory}"></td>
                        <td th:text="${vg.game.status}"></td>
                    </tr>
                    </tbody>
                </table>
                <div th:if="${#lists.size(games) == 0}" class="text-secondary">
                    Chưa gán voucher này cho game nào.
                </div>
            </div>
        </div>
    </div>

</div>
<script th:src="@{/Accest/JS/code.js}"></script>
</body>
</html>
